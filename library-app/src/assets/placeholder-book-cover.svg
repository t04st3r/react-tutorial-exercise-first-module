<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <!-- Background -->
  <rect width="200" height="300" fill="#4a5568"/>

  <!-- Book icon -->
  <g transform="translate(100, 150)">
    <!-- Book shape -->
    <rect x="-40" y="-50" width="80" height="100" fill="#718096" rx="4"/>
    <rect x="-35" y="-45" width="70" height="90" fill="#a0aec0" rx="2"/>

    <!-- Book lines -->
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="15" x2="15" y2="15" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="100" y="220" text-anchor="middle" fill="#cbd5e0" font-family="Arial, sans-serif" font-size="14" font-weight="500">
    No Cover
  </text>
  <text x="100" y="240" text-anchor="middle" fill="#cbd5e0" font-family="Arial, sans-serif" font-size="14" font-weight="500">
    Available
  </text>
</svg>